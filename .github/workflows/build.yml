name: Build DynamicIslandBanner deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS 上的 Apple clang/ld64 才能产出真的 arm64e 切片；macos-15-intel 排队最短
    runs-on: macos-15-intel
    steps:
      - name: 下载源码
        run: |
          curl -fL -o /tmp/src.zip "https://aka.doubaocdn.com/s/vLSUgLTNi8"
          rm -rf "$HOME/src"
          mkdir -p "$HOME/src/dib"
          unzip -q /tmp/src.zip -d "$HOME/src/dib"
          ls -1 "$HOME/src/dib"

      - name: 安装 ldid
        run: brew install ldid

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 编译 rootless 双架构包
        run: |
          cd "$HOME/src/dib"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"

      - name: 校验切片
        continue-on-error: true
        run: |
          cd "$HOME/src/dib"
          dpkg-deb -x packages/*.deb /tmp/pkg
          lipo -info /tmp/pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/DynamicIslandBanner.dylib
          ls -R /tmp/pkg/var/jb/Library/MobileSubstrate
          ls -R /tmp/pkg/var/jb/Library/PreferenceLoader

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandBanner-deb
          path: /Users/runner/src/dib/packages/*.deb
          if-no-files-found: error
