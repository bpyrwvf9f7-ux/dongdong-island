name: Build arm64e deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS 上的 Apple clang/ld64 才能产出真的 arm64e 切片；macos-15-intel 排队最短
    runs-on: macos-15-intel
    steps:
      - name: 下载源码
        run: |
          curl -fL -o /tmp/src.zip "https://aka.doubaocdn.com/s/YuAtQPwDpP"
          rm -rf "$HOME/src"
          mkdir -p "$HOME/src"
          unzip -q /tmp/src.zip -d "$HOME/src"
          ls -1 "$HOME/src"

      - name: 安装 ldid
        run: brew install ldid

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 编译 rootless 双架构包
        run: |
          cd "$HOME/src"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"

      - name: 校验切片
        continue-on-error: true
        run: |
          cd "$HOME/src"
          dpkg-deb -x packages/*.deb /tmp/pkg
          lipo -info /tmp/pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/BadIsland.dylib
          lipo -info /tmp/pkg/var/jb/Library/PreferenceBundles/BadIslandPrefs.bundle/BadIslandPrefs

      - name: 发布公共直链
        continue-on-error: true
        run: |
          cd "$HOME/src"
          DEB=$(ls packages/*.deb | head -1)
          echo "LOCALDEB=$DEB"
          ls -l "$DEB"
          echo "--- tmpfiles ---"
          R1=$(curl -sS -m 120 -F "file=@$DEB" https://tmpfiles.org/api/v1/upload || true)
          echo "TMPFILES_JSON=$R1"
          echo "--- 0x0 ---"
          R2=$(curl -sS -m 120 -A "Mozilla/5.0 dongdongci" -F "file=@$DEB" https://0x0.st || true)
          echo "ZEROX_URL=$R2"

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: badisland-deb
          path: /Users/runner/src/packages/*.deb
          if-no-files-found: error
